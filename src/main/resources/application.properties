spring.application.name=demo

# 루트의 .env 파일(있으면)을 읽어들인다 — .env는 .properties와 같은 key=value 문법이라
# 별도 라이브러리 없이 Spring Boot의 config import 기능만으로 로드 가능
spring.config.import=optional:file:.env[.properties]

# MySQL — 기본값은 로컬(DB가 없으면 자동 생성), .env의 DB_URL/DB_USERNAME/DB_PASSWORD로 원격(Aiven 등) 오버라이드 가능
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/maeumsumgil?createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SMS 인증번호 유효시간(초)
app.sms.code-ttl-seconds=180
# 이 시간(분)이 지난 코드는 옥토모에 조회하지 않고 즉시 실패 처리(불필요한 API 호출 방지)
app.sms.code-lookup-window-minutes=30
# 이 시간(시간)이 지나면 매칭 완료/미매칭/만료 여부와 무관하게 저장소에서 삭제
app.sms.code-retention-hours=24
# 개발용: 이 번호로 인증 요청 시 옥토모 조회 없이 무조건 성공 처리 (본인/보호자 인증 공통).
# 로컬 개발 전용 — 운영 환경(.env)에서는 반드시 비워둘 것.
app.sms.dev-bypass-phone=${SMS_DEV_BYPASS_PHONE:}

# 옥토모(Octomo) MO 문자 인증 연동 — https://octomo.octoverse.kr (마이페이지에서 API Key 발급)
# 키는 커밋하지 않는다 — 환경변수 OCTOMO_API_KEY로 주입 (실행 예: OCTOMO_API_KEY=xxx ./gradlew bootRun)
app.octomo.api-key=${OCTOMO_API_KEY:}
app.octomo.base-url=https://api.octoverse.kr
# 옥토모 조회 시 "최근 N분 내 도착한 문자"로 한정할 기준(옥토모 message/exists의 withinMinutes)
app.octomo.within-minutes=5

# 공공데이터포털 TourAPI(KorService2) — 강원도 시군구별 관광지 실시간 조회
app.tour.api-key=${TOUR_API_KEY:}
app.tour.base-url=https://apis.data.go.kr/B551011/KorService2
# 조회 결과 캐시 TTL(초) — 정적 데이터 대체 금지, API 부하 완화용 짧은 캐시만 허용
app.tour.cache-ttl-seconds=300

# JWT (개발용 시크릿 — 운영에서는 환경변수로 주입할 것)
app.jwt.secret=mDC9Av+xhsGZCJBd1hQpRtF6JXtKgOHm2NrIU+LEWMg=
app.jwt.expiration-ms=3600000

# 카카오 모빌리티 길찾기(Directions) API — https://developers.kakaomobility.com
# 키는 커밋하지 않는다 — 환경변수 KAKAO_API_KEY로 주입 (실행 예: KAKAO_API_KEY=xxx ./gradlew bootRun)
app.kakao.api-key=${KAKAO_API_KEY:}
app.kakao.directions-base-url=https://apis-navi.kakaomobility.com/v1/directions
# 경로가 이 거리(m) 이내로 터널 구간에 근접하면 "터널을 지난다"고 판단
app.route.tunnel-buffer-meters=30
